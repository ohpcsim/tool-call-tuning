    - pyproject.toml
    - uv.lock
    - configs/launcher.yaml
    - docs/protocol/protocol-v1.md
    - src/desk/scorer.py
    - src/todo/common.py
    - studies/todo/a8-system
    - src/todo/import_a8.py
    - studies/todo/archive-imports.yaml
    - data/todo/a8/arm1-e3
    - models/base
    - docs/protocol/frontier-rulebook-v1.md
