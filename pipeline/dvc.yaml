    params:
    - todo.split.near_threshold
    outs:
    - data/todo/leakcheck.json
  environment:
    wdir: ../..
    cmd: python -m desk.environment --config configs/launcher.yaml --out data/todo/env.json
    deps:
    - pyproject.toml
    - uv.lock
    - configs/launcher.yaml
